[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-overlay"
version = "0.1.0"
description = "A transparent, click-through, always-on-top web overlay for Wayland"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mitchell Hoover" }]
requires-python = ">=3.10"
# None from PyPI: PyGObject, pycairo, GTK, WebKit2GTK and gtk-layer-shell come
# from your distro, so install with `pipx install --system-site-packages` (see README).
dependencies = []

[project.urls]
Homepage = "https://github.com/FluffCycle/glassbox-overlay"
Repository = "https://github.com/FluffCycle/glassbox-overlay"
Issues = "https://github.com/FluffCycle/glassbox-overlay/issues"

[project.gui-scripts]
glassbox-overlay = "glassbox_overlay.overlay:main"

[tool.setuptools]
packages = ["glassbox_overlay"]

[tool.setuptools.package-data]
glassbox_overlay = ["*.conf", "*.desktop", "*.svg"]
