# Glassbox Overlay settings.
#
# Edit these and save, then start (or restart) Glassbox Overlay.
# Options given on the command line override what's set here.
#
# Your overlay URL doesn't go here: put it in glassbox-overlay-source.txt,
# which is kept out of git so it isn't shared by accident.

[overlay]
# Which monitor to show the overlay on: 0, 1, 2, ...
# Leave blank to use the primary monitor.
monitor =

# The width your overlay page was designed for (your OBS or overlay-tool
# canvas width). The page is scaled so this width fills the monitor.
# 0 turns scaling off.
canvas_width = 1920

# Opacity of the whole overlay, from 0.0 (invisible) to 1.0 (fully visible).
opacity = 1.0

# Show the system tray icon (with Reload and Quit): true or false.
tray = true

# Draw a red border around the overlay so you can see where it is,
# and enable the WebKit inspector: true or false.
debug = true

# Allow more than one Glassbox Overlay to run at the same time: true or false.
# Leave this off unless you really want several overlays at once; otherwise
# starting it twice by accident would play every alert twice.
allow_multiple_instances = false
